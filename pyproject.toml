[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-web"
version = "1.0.0"
description = "Crawl any website, download linked files (PDF, DOCX...), rename by page title, and zip results."
readme = "crawl_web/README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
]

[project.scripts]
crawl-web = "crawl_web:main"

[project.urls]
Repository = "https://github.com/caikhongnenhoi-24042026org/voice-pro"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawl_web*"]
